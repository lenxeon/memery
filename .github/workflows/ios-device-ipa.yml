name: iOS Device IPA (Sideloadly)

on:
  push:
    branches: [canvas, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-device-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify scene asset loading
        run: node --import tsx --test scripts/verify-scene-asset-cache.ts

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor iOS project
        run: npm run ios:sync

      - name: Archive unsigned iOS device app
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/Memery.xcarchive"
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGNING_ALLOWED=NO
          archive

      - name: Package and validate IPA
        run: |
          set -euo pipefail
          app_path="$RUNNER_TEMP/Memery.xcarchive/Products/Applications/App.app"
          test -d "$app_path"
          mkdir -p "$RUNNER_TEMP/Payload"
          ditto "$app_path" "$RUNNER_TEMP/Payload/App.app"
          (cd "$RUNNER_TEMP" && /usr/bin/zip -qry Memery-Unsigned.ipa Payload)
          unzip -tq "$RUNNER_TEMP/Memery-Unsigned.ipa"
          unzip -p "$RUNNER_TEMP/Memery-Unsigned.ipa" Payload/App.app/Info.plist >/dev/null

      - name: Upload unsigned IPA for Sideloadly
        uses: actions/upload-artifact@v7
        with:
          name: memery-ios-unsigned-ipa-${{ github.sha }}
          path: ${{ runner.temp }}/Memery-Unsigned.ipa
          if-no-files-found: error
          retention-days: 14
