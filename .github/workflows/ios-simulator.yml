name: iOS Simulator Build

on:
  push:
    branches: [canvas, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor iOS project
        run: npm run ios:sync

      - name: Build simulator app
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Release
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package simulator app
        run: >-
          ditto -c -k --sequesterRsrc --keepParent
          "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator/App.app"
          "$RUNNER_TEMP/Memery-iOS-Simulator.app.zip"

      - name: Upload simulator app
        uses: actions/upload-artifact@v7
        with:
          name: memery-ios-simulator-${{ github.sha }}
          path: ${{ runner.temp }}/Memery-iOS-Simulator.app.zip
          if-no-files-found: error
          retention-days: 14
